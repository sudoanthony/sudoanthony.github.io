<body>

<nav class="nav"><div class="wrap">

  <div class="links">

    <a href="vulns.html">vulns</a>

  </div>

<main class="wrap" style="padding-top:44px">

  <p style="color:var(--text-3)">Every box, newest first. Techniques link into the <a href="vulns.html">vulnerability index</a>.</p>
  <ul class="wlist" id="list"></ul>

<footer class="foot"><div class="wrap" style="display:flex;gap:18px;flex-wrap:wrap">

<script src="data.js"></script>
<script>
  const sorted = [...WRITEUPS].sort((a,b) => (a.date < b.date ? 1 : -1));
  document.getElementById('list').innerHTML = sorted.length ? sorted.map(w =>
    '<li>' +
      '<a class="wt" href="' + w.url + '">' + w.title + '</a>' +
      '<span class="wm">' + w.platform + ' · ' + w.difficulty + ' · ' + w.date + '</span>' +
      '<span class="wd">' + w.summary + '</span>' +
    '</li>').join('')
    : '<li><span class="wd">No writeups yet.</span></li>';
</script>
</body>
</html>
